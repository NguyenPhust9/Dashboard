[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/amis-worker/supervisord.pid
childlogdir=/tmp/amis-worker

[unix_http_server]
file=/tmp/amis-worker/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/amis-worker/supervisor.sock

[program:display]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:browser]
command=node /app/deploy/crm-worker/browser.mjs
directory=/app
priority=20
autorestart=true
stopwaitsecs=20
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:worker]
command=node /app/deploy/crm-worker/start-worker.mjs
directory=/app
priority=30
autorestart=true
stopwaitsecs=420
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:login]
command=node /app/deploy/crm-worker/login.mjs
directory=/app
priority=40
autostart=false
autorestart=false
stopwaitsecs=5
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
